[project]
name = "toolcheck"
version = "0.1.0"
description = "TOML-driven linter for LLM tool calls — a declarative rule catalogue, a predicate compiler, and a CLI with a Claude PreToolUse hook mode."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
toolcheck = "toolcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolcheck"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "pyright>=1.1.380",
]

[tool.ruff]
src = ["src", "tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
