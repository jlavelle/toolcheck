# Read hint rules.

[[rule]]
name         = "read-already-read"
tool         = "Read"
message      = "file already Read this session — skip the redundant Read"
severity     = "warning"
sample_field = "file_path"

[rule.match]
cross_call = { kind = "duplicate_field_within_session", field = "file_path" }

[[rule]]
name         = "read-context-exhausted"
tool         = "Read"
message      = "context is nearly full (≥200k tok) — summarise or compact before reading more"
severity     = "error"
sample_field = "file_path"

[rule.match]
context_length = { op = ">=", value = 200000 }
